identity:
  author: "shineos"
  name: "line-message-sender"
  label:
    en_US: "LINE Message Sender"
    ja_JP: "LINEメッセージ送信"
    zh_Hans: "LINE Message Sender"
    pt_BR: "LINE Message Sender"
  description:
    en_US: "Send push and broadcast messages to LINE users and groups from Dify workflows via the LINE Messaging API."
    ja_JP: "LINEのMessaging APIで、DifyのワークフローからLINEユーザー・グループへメッセージを送信します。"
    zh_Hans: "Send messages to LINE via the LINE Messaging API"
    pt_BR: "Send messages to LINE via the LINE Messaging API"
  icon: "icon.svg"

credentials_for_provider:
  channel_access_token:
    type: "secret-input"
    required: true
    label:
      en_US: "Channel access token"
      ja_JP: "チャネルアクセストークン"
      zh_Hans: "Channel access token"
      pt_BR: "Channel access token"
    placeholder:
      en_US: "Paste the long-lived channel access token of your LINE Messaging API channel"
      ja_JP: "LINE Messaging APIチャネルの長期チャネルアクセストークンを貼り付けてください"
      zh_Hans: "Paste the long-lived channel access token"
      pt_BR: "Paste the channel access token"
    help:
      en_US: "Get it from the LINE Developers Console → your Messaging API channel → Messaging API tab. Use the long-lived token, not the short-lived one."
      ja_JP: "LINE Developersコンソール → Messaging APIチャネル → 「Messaging API」タブで発行できます。短期ではなく長期のチャネルアクセストークンを使用してください。"
      zh_Hans: "Get it from the LINE Developers Console (Messaging API tab)."
      pt_BR: "Get it from the LINE Developers Console (Messaging API tab)."
    url: "https://developers.line.biz/console/"

tools:
  - tools/send_push_message.yaml
  - tools/send_broadcast_message.yaml
  - tools/get_profile.yaml
  - tools/get_bot_info.yaml

extra:
  python:
    source: provider/line-message-sender.py
