description:
  en_US: Send push and broadcast messages to LINE users and groups from your Dify workflows, using the LINE Messaging API. Not an official LINE product.
  ja_JP: Difyのワークフローやチャットフローから、LINEのMessaging APIを使ってLINEユーザー・グループへメッセージを送信します。定期レポートの通知、アラート配信などに利用できます。※LINE株式会社の公式プラグインではありません。
  zh_Hans: Send push and broadcast messages to LINE via the LINE Messaging API
  pt_BR: Send push and broadcast messages to LINE via the LINE Messaging API
